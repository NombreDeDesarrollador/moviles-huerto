spring.application.name=huertolindo-backend

spring.datasource.url=jdbc:mysql://localhost:3306/huertolindo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload-dir=uploads
app.admin.email=${HUERTO_ADMIN_EMAIL:admin@huertolindo.local}
app.admin.password=${HUERTO_ADMIN_PASSWORD:Admin123!}
app.cors.allowed-origins=${HUERTO_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://10.0.2.2:3000}
